<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Entrar · Bom Dia</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231E2E52'/%3E%3Ccircle cx='16' cy='16' r='5' fill='none' stroke='%23F2C94C' stroke-width='2'/%3E%3C/svg%3E">
  <style>
    @font-face { font-family: InterVariable; src: url("assets/InterVariable.woff2") format("woff2"); font-display: swap; font-weight: 100 900; }
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", InterVariable, Inter, system-ui, sans-serif; --blue: #0066cc; --blue-hover: #0055ad; --warm: #f5f5f7; --paper: #fff; --ink: #1d1d1f; --muted: #6e6e73; --line: #d2d2d7; --sun: #f5c542; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; background: var(--warm); color: var(--ink); -webkit-font-smoothing: antialiased; }
    .login-shell { min-height: 100svh; display: grid; grid-template-columns: minmax(300px, .82fr) minmax(420px, 1.18fr); }
    .login-brand { position: relative; display: flex; flex-direction: column; justify-content: space-between; padding: clamp(32px, 5vw, 72px); background: #000; color: white; }
    .brand { position: relative; z-index: 1; display: flex; align-items: center; gap: 12px; font-size: 21px; font-weight: 750; letter-spacing: -.4px; }
    .sun { width: 34px; height: 34px; color: var(--sun); }
    .login-note { position: relative; z-index: 1; max-width: 430px; }
    .login-note h1 { margin: 0; max-width: 9ch; font-size: clamp(42px, 5.5vw, 76px); font-weight: 650; line-height: .96; letter-spacing: -.06em; }
    .login-note p { margin: 24px 0 0; max-width: 30ch; color: rgba(255,255,255,.58); font-size: 16px; line-height: 1.55; }
    .login-main { display: grid; place-items: center; padding: clamp(24px, 7vw, 96px); background: var(--paper); }
    .login-form { width: min(100%, 390px); animation: arrive .35s cubic-bezier(.16,1,.3,1) both; }
    .eyebrow { margin: 0 0 14px; color: var(--blue); font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .login-form h2 { margin: 0; font-size: clamp(34px, 4vw, 44px); font-weight: 650; line-height: 1.03; letter-spacing: -.05em; }
    .intro { margin: 12px 0 30px; color: var(--muted); line-height: 1.55; }
    label { display: block; margin: 0 0 8px; color: #4e4e57; font-size: 13px; font-weight: 650; }
    input { width: 100%; min-height: 52px; margin-bottom: 18px; padding: 13px 0; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; color: var(--ink); font: inherit; font-size: 16px; outline: none; transition: border-color .15s; }
    input:focus { border-color: var(--blue); border-bottom-width: 2px; }
    button { width: 100%; min-height: 52px; margin-top: 12px; border: 0; border-radius: 999px; background: var(--blue); color: white; font: inherit; font-weight: 650; cursor: pointer; transition: transform .1s, background .15s; }
    button:hover { background: var(--blue-hover); }
    button:active { transform: scale(.97); }
    button:focus-visible, input:focus-visible { outline: 3px solid rgba(0,102,204,.25); outline-offset: 3px; }
    .login-error { margin: -4px 0 18px; padding: 10px 12px; border-left: 3px solid #c25b54; background: #f7e7e5; color: #a34540; border-radius: 4px 9px 9px 4px; font-size: 13px; }
    .privacy { margin: 20px 0 0; color: var(--muted); font-size: 12px; text-align: center; }
    @keyframes arrive { from { opacity: 0; transform: translateY(12px); } }
    @media (max-width: 760px) {
      .login-shell { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      .login-brand { min-height: 184px; padding: max(22px, env(safe-area-inset-top)) 22px 26px; gap: 34px; }
      .login-note h1 { max-width: 12ch; font-size: 36px; }
      .login-note p { display: none; }
      .login-main { place-items: start center; padding: 34px 20px max(36px, env(safe-area-inset-bottom)); }
      .intro { margin-bottom: 24px; }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main class="login-shell">
    <section class="login-brand" aria-label="Bom Dia">
      <div class="brand">
        <svg class="sun" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="16" cy="16" r="5"/><path d="M16 3v4M16 25v4M3 16h4M25 16h4M6.8 6.8l2.8 2.8M22.4 22.4l2.8 2.8M6.8 25.2l2.8-2.8M22.4 9.6l2.8-2.8"/></svg>
        Bom Dia
      </div>
      <div class="login-note">
        <h1>Seu dia começa aqui.</h1>
        <p>Uma barreira simples enquanto preparamos a autenticação definitiva.</p>
      </div>
    </section>
    <section class="login-main">
      <form class="login-form" action="/login" method="post">
        <p class="eyebrow">Acesso privado</p>
        <h2>Bem-vindo de volta</h2>
        <p class="intro">Entre para acessar suas demandas, projetos e anotações.</p>
        {{ERROR}}
        <label for="username">Usuário</label>
        <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
        <label for="password">Senha</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Entrar no Bom Dia</button>
        <p class="privacy">Sessão protegida por cookie seguro.</p>
      </form>
    </section>
  </main>
</body>
</html>
